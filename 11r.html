<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let newString = [];
        function removeEgg(paraString)
        {
            for(let i = 0; i<paraString.length; i++)
            {
                if(paraString[i] != 'egg')
                    newString.push(paraString[i]);
            }
            return newString;
        }
        console.log(removeEgg(['egg', 'apple', 'egg', 'egg', 'ham']));
    </script>
</body>
</html>
