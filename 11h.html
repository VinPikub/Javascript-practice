<!DOCTYPE html>
<html lang="en">

<body>
    <script>
        function addOne(values)
        {
            let result = [];
            for(let i =0; i< values.length; i++)
            {
                result.push(values[i] +1);
            }
            return result;
        }
        let firstArray = [-2, -1, 0, 99];
        let secondArray = addOne(firstArray);
        console.log(secondArray);
    </script>
</body>
