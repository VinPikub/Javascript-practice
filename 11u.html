<body>
    <script>
        function removeEgg(paraString)
        {
            let outputString = [];
            let count = 0;
            paraString.reverse();
            for(let i = 0; i<paraString.length; i++)
            {
                if(paraString[i] === 'egg')
                {
                    count++;
                    if(count > 2)
                        outputString.push(paraString[i]);
                }
                else
                    outputString.push(paraString[i]);
            }
            return outputString.reverse();
        }
        const foods = ['egg', 'apple', 'egg', 'egg', 'ham'];
        let newString = foods.slice();
        console.log(removeEgg(newString));
        console.log(foods);
    </script>
