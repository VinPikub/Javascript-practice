<body>
    <script>
        function addArrays(arrayOne, arrayTwo)
        {
            let finalArray = [];
            let value;
            for(let i =0; i < arrayOne.length; i++)
            {
                value = arrayOne[i]+arrayTwo[i];
                finalArray.push(value);
            }
            return finalArray;
        }
        //let lastArray = addArrays([1, 2, 3], [4, 5, 6]);
        console.log(addArrays([1, 2, 3], [4, 5, 6]));
    </script>
