<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Todo List Practice 2</p>
    <input id="input" type="text" placeholder="Todo name">
    <input id="due" type="date">
    <button id="add" onclick="
    let name = document.querySelector('#input').value;
    let due = document.querySelector('#due').value;
    enteredValue.push({name: name,
        due: due
    });
    document.querySelector('#input').value = '';
    document.querySelector('#due').value = '';
    todoFunc();
    ">Add</button>
    <div id="show"></div>
    <script>
        let enteredValue = [];
        function todoFunc(){
        let showText = '';
        for(let i =0; i<enteredValue.length; i++)
        {
            let todo = enteredValue[i];
            let html = `<p id="para">
                        ${todo.name} ${todo.due}<button id="delete" onclick="
                        enteredValue.splice(${i}, 1);
                        todoFunc();
                        ">Delete</button>
                        </p>`;
            showText += html;
        }
        let value = document.querySelector('#show');
        value.innerHTML = showText;
    }
    </script>
</body>
</html>
