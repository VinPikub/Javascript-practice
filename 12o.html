<body>
    <script>
        function removeEgg(foods){
            let count = 0
            console.log(foods.filter((value) => {
                if(value === 'egg')
                {
                    count++;
                    if(count < 3)
                        return false;
                    else
                        return true;
                }
                else
                    return true;
            }));
        }
        removeEgg(['egg', 'apple', 'egg', 'egg', 'ham']);
    </script>
