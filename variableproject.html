<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable Project</title>
</head>
<body>
    <script>
        let variable = 0;
    </script>
    <p>Cart Quantity</p>
    <button onclick="
    console.log(`Cart quantity: ${variable}`);">Show Quantity</button>
    <button onclick="
    variable += 1;
    console.log(`Cart quantity: ${variable}`);">Add to Cart</button>
    <button onclick="
    variable += 2;
    console.log(`Cart quantity: ${variable}`);">+2</button>
    <button onclick="
    variable += 3;
    console.log(`Cart quantity: ${variable}`);">+3</button>
    <button onclick="
    variable = 0;
    console.log('Cart was reset')
    console.log(`Cart quantity: ${variable}`);">Reset Cart</button>
</body>
</html>
