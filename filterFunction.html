<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*.filter()
        1. Creates a new array []
        2. return true,
            => put value in array
        3. return false,
            => not put value in array
        */
        console.log([1, 3, -5].filter((value, index) => {
            if( value < 0)
                return false;
            else
                return true;
        }));
    </script>
</body>
