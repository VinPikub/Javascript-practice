<!DOCTYPE html>
<html lang="en">

<body>
    <script>
        function addNum(array, num)
        {
            let finalArray = [];
            for(let i = 0; i<array.length; i++)
                finalArray.push(array[i] + num);
            return finalArray;
        }
        let firstArray = [-2, -1, 0, 99];
        let secondArray = addNum(firstArray, 2);
        console.log(secondArray);
    </script>
</body>
</html>
