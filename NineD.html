<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NineD</title>
</head>
<body>
    <input type=""text" placeholder="Name" id="text-box" onkeydown="
    if (event.key == 'Enter')
        showName();">
    <button onclick="
    showName();">Submit</button>
    <p id="show"></p>
    
    <script>
        function showName()
        {
            let name = document.querySelector('#text-box').value;
            let value = document.querySelector('#show');
            value.innerHTML = `Your name is: ${name}`;
        }
    </script>
</body>
</html>
