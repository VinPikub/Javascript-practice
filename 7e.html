<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sevenE</title>
</head>
<body>
    <script>
        function convertToCelsius(fahren)
        {
            let celsius = 5*(fahren - 32)/9;
            return celsius;
        }
        console.log(`${convertToCelsius(86)}`);
    </script>
</body>
</html>
