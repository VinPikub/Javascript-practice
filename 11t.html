<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let newString = [];
        function removeEgg(paraString)
        {
            paraString.reverse();
            let count = 0;
            for(let i = 0; i<paraString.length; i++)
            {
                if(count < 2)
                {
                    if(paraString[i] === 'egg')
                    {
                        count++;
                        continue;
                    }
                }
                newString.push(paraString[i]);
            }
            return newString.reverse();
        }
        console.log(removeEgg(['egg', 'apple', 'egg', 'egg', 'ham']));
    </script>
</body>
</html>
