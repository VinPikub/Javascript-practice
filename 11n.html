<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function countWords(words)
        {
            let numApple = 0;
            let numGrape = 0;
            let obj= {};
            for(let i = 0; i<words.length; i++)
            {
                if(words[i] === 'apple')
                    numApple++;
                else
                    numGrape++;
            }
            obj.apple = numApple;
            obj.grape = numGrape;
            return obj;
        }
        console.log(countWords(['apple', 'grape', 'apple', 'apple']));
    </script>
</body>
</html>
