    <title>SevenD</title>

<body>
    <script>
        function convertToFahrenheit(celsius)
        {
            let fahren = 9*celsius/5 + 32;
            return fahren;
        }
        //let result = convertToFahrenheit(25);
        //console.log(`${result}`);
        console.log(`${convertToFahrenheit(25)}`);
    </script>
