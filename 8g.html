<body>
    <script>
        const product = {
            name: 'basketball',
            price: 2095
        };
        console.log(product);
        product.price += 500;
        console.log(product);
        product['delivery-time'] = '3 days';
        console.log(product);

        const product1 = {
            name: 'milk',
            price: 425
        };
        const product2 = {
            name: 'powder',
            price: 500
        };
        function compare(product1, product2)
        {
            if (product1.price > product2.price)
                return product1.name;
            else
                return product2.name;
        }
        console.log(compare(product1, product2));
        function isSameProduct(product1, product2)
        {
            if (product1.name === product2.name)
            {
                if (product1.price === product2.price)
                    return true;
                else
                    return false;
            }
            else
                return false;
        }
        console.log(isSameProduct(product1, product2));
        let str = 'Good Morning'.toLowerCase();
        console.log(str);
        
        let str1 = 'test'.repeat(2);
        console.log(str1);
    </script>
