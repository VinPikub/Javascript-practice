<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NineC</title>
</head>
<body>
    <button onclick="
        clickButt('heads');">heads</button>
    <button onclick="
    clickButt('tails');">tails</button>

        let value = document.querySelector('#para');

        }
