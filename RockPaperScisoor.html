<!DOCTYPE html>
<html lang="en">
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <p>Rock Paper Scissor</p>
    <script>
        let userChoice;
        let flag;
        let userFlag;
        let computerChoice;
        let win_score=0, lose_score=0, tie_score=0;
        function rockpaperscissor(x)
        {
            if (x === 0)
                flag = 'Rock';
            else if (x === 1)
                flag = 'Paper';
            else
                flag = 'Scissor';
        }
        function winorlose(userFlag)
        {
            if(userChoice === 0 && computerChoice === 2)
            {
                win_score+= 1;
                alert(`You picked ${userFlag}. Computer picked ${flag}. You win.\nWins: ${win_score}, Losses: ${lose_score}, Ties:${tie_score}`)
            }
    
            else if(userChoice === 2 && computerChoice === 0)
            {
                lose_score+=1;
                alert(`You picked ${userFlag}. Computer picked ${flag}. You lose.\nWins: ${win_score}, Losses: ${lose_score}, Ties:${tie_score}`)
            }

            else if(userChoice > computerChoice)
            {
                win_score+=1;
                alert(`You picked ${userFlag}. Computer picked ${flag}. You win.\nWins: ${win_score}, Losses: ${lose_score}, Ties:${tie_score}`)
            }
    
            else if(userChoice < computerChoice)
            {
                lose_score +=1;
                alert(`You picked ${userFlag}. Computer picked ${flag}. You lose.\nWins: ${win_score}, Losses: ${lose_score}, Ties:${tie_score}`)
            }
    
            else if(userChoice === computerChoice)
            {
                tie_score +=1;
                alert(`You picked ${userFlag}. Computer picked ${flag}. Tie.\nWins: ${win_score}, Losses: ${lose_score}, Ties:${tie_score}`)
            }
        }
    </script>
    <button onclick="
    computerChoice = Math.floor(Math.random() * 3);
    rockpaperscissor(computerChoice);
    userChoice = 0;
    userFlag = 'Rock';
    winorlose(userFlag);
    ">Rock</button>
    <button onclick="
    computerChoice = Math.floor(Math.random() * 3);
    rockpaperscissor(computerChoice);
    userChoice = 1;
    userFlag = 'Paper'
    winorlose(userFlag);"
    >Paper</button>
    <button onclick="
    computerChoice = Math.floor(Math.random() * 3);
    rockpaperscissor(computerChoice);
    userChoice = 2;
    userFlag = 'Scissor'
    winorlose(userFlag);"
    >Scissors</button>
    <button onclick="
    win_score=0, lose_score= 0, tie_score = 0;
    console.log(`win score: ${win_score}, lose score: ${lose_score} and tie score: ${tie_score}`)">Reset Score</button>
    <p><a href="https://supersimple.dev/projects/rock-paper-scissors/">Click here </a>to see the final version of the project.</p>
</body>
</html>
